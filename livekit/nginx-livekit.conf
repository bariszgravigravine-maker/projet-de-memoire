# LiveKit WebSocket sécurisé — https://vps123057.serveur-vps.net -> LiveKit :7880
server {
    listen 443 ssl;
    server_name vps123057.serveur-vps.net;

    ssl_certificate     /etc/letsencrypt/live/vps123057.serveur-vps.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps123057.serveur-vps.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
