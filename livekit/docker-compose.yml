services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - /opt/livekit/livekit.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
